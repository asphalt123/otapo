plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.hn.otapo'
    compileSdk 34

    defaultConfig {
        // NOTE: must match the watch app (com.hn.otapo). The Wear Data
        // Layer (DataClient/MessageClient) only routes between apps with the same
        // package name AND signature — with a different ID here GMS silently drops
        // everything and the watch WearableListenerService is never even created.
        // namespace above stays com.hn.otapo (code/R only).
        applicationId "com.hn.otapo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // Configuré via variables d'env CI ; fallback debug si absent.
            // Vérifie l'existence du fichier (voir app/build.gradle).
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isEmpty() && new File(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
        release {
            // R8/minification désactivés : voir commentaire dans app/build.gradle.
            minifyEnabled false
            shrinkResources false
            debuggable false
            crunchPngs true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isEmpty() && new File(keystorePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'io.ktor:ktor-client-core:2.3.12'
    implementation "io.ktor:ktor-client-android:2.3.12"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
}
