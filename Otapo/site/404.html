<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Otapo</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#08090c">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}
:root{--bg:#08090c;--surface:#0e1116;--tx:#f2f4f7;--mut:#9aa1ad;--line:rgba(255,255,255,.09);--lime:#c5ff3a;--lime-ink:#101500;--r:14px;--ease:cubic-bezier(.22,1,.36,1)}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{line-height:1.08;letter-spacing:-.03em;margin:0 0 .7rem;font-weight:650}
h1{font-size:clamp(2.6rem,6vw,4.4rem);font-weight:680}
h2{font-size:clamp(1.7rem,3.4vw,2.5rem)}
a{color:inherit}
::selection{background:rgba(197,255,58,.28)}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-9999px;top:0;background:var(--lime);color:#000;padding:.7rem 1.1rem;border-radius:10px;z-index:200;font-weight:700}
.skip:focus{left:1rem;top:1rem}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:100;background:rgba(8,9,12,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:1.2rem;padding:.9rem 24px}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.12rem;color:var(--tx);text-decoration:none;letter-spacing:-.02em}
.mark{width:28px;height:28px;border-radius:8px;background:var(--lime);display:grid;place-items:center;font-size:1rem;color:#000;font-weight:800}
.links{margin-inline-start:auto;display:flex;gap:1.2rem;align-items:center}
.links a.nl{color:var(--mut);text-decoration:none;font-size:.92rem;transition:color .2s}
.links a.nl:hover{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:650;text-decoration:none;border-radius:12px;padding:.95rem 1.6rem;font-size:.98rem;border:1px solid transparent;cursor:pointer;transition:opacity .2s var(--ease),transform .2s var(--ease),background .2s}
.btn-primary{background:var(--lime);color:var(--lime-ink)!important}
.btn-primary:hover{opacity:.88;transform:translateY(-2px)}
.btn-secondary{background:#151a21;color:var(--tx)!important;border-color:var(--line)}
.btn-secondary:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22)}
.btn-sm{padding:.62rem 1.05rem;font-size:.9rem;border-radius:10px}
select.lang{background:#151a21;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;font-size:.88rem;cursor:pointer}
select.lang option{color:#111}
section.block{padding:100px 0;border-top:1px solid var(--line)}
section.block:first-of-type{border-top:0}
.eyebrow{color:var(--lime);font-weight:650;letter-spacing:.1em;text-transform:uppercase;font-size:.76rem;margin:0 0 .7rem}
.sub{color:var(--mut);max-width:38rem;margin:0 0 3rem;font-size:1.06rem}
/* hero */
.hero{padding:110px 0 90px;display:grid;grid-template-columns:1.05fr .95fr;gap:4rem;align-items:center}
.badge{display:inline-flex;align-items:center;gap:.55rem;border:1px solid var(--line);color:var(--mut);padding:.42rem .95rem;border-radius:999px;font-size:.82rem;background:rgba(255,255,255,.02)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--lime);flex:none}
.lime{color:var(--lime)}
.lead{color:var(--mut);font-size:1.13rem;max-width:33rem;margin:1.2rem 0 0}
.cta{display:flex;gap:.8rem;flex-wrap:wrap;margin:2rem 0 .9rem}
.micro{color:var(--mut);font-size:.87rem;margin:0}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;padding:0}
.stat b{display:block;font-size:2.5rem;font-weight:680;letter-spacing:-.04em;line-height:1.1}
.stat span{color:var(--mut);font-size:.9rem}
/* mockup */
.mock{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:1.4rem;min-height:440px}
.mock-glow{position:absolute;left:50%;top:50%;width:480px;height:480px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(197,255,58,.20),transparent 65%);filter:blur(70px);animation:glowPulse 5s ease-in-out infinite;pointer-events:none}
@keyframes glowPulse{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.phone{position:relative;width:240px;border-radius:36px;padding:10px;background:#10141b;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:floatY 6s ease-in-out infinite}
.screen{background:#0a0d12;border-radius:28px;padding:.95rem;min-height:370px;border:1px solid rgba(255,255,255,.06)}
.notch{width:100px;height:20px;background:#000;border-radius:999px;margin:0 auto .9rem;border:1px solid rgba(255,255,255,.06)}
.srow{display:flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:.65rem .75rem;margin:.5rem 0;font-size:.85rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);flex:none}
.dot.off{background:#3a414b}
.tgl{margin-inline-start:auto;font-size:.7rem;font-weight:750;color:var(--lime)}
.tgl.off{color:var(--mut)}
.watch{position:relative;width:180px;border-radius:44px;padding:10px;background:#10141b;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:floatY 7s ease-in-out infinite reverse}
.watch .screen{border-radius:34px;min-height:280px;text-align:center}
.glow-line{height:2px;border-radius:99px;background:var(--lime);opacity:.7;margin:.65rem 0}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
/* features: no cards, text + minimal icons */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3rem 2.5rem}
.feat{transition:transform .2s var(--ease)}
.feat:hover{transform:translateY(-2px)}
.fic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(197,255,58,.06);margin-bottom:1rem}
.fic svg{width:20px;height:20px}
.feat h3{font-size:1.02rem;margin:0 0 .4rem}
.feat p{color:var(--mut);margin:0;font-size:.94rem;line-height:1.6}
/* compat: stripped table */
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:1rem .5rem;text-align:start;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border-bottom:1px solid rgba(255,255,255,.16)}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(255,255,255,.025)}
td b{font-weight:650}
/* install: stripped vertical timeline */
.steps{list-style:none;margin:0;padding:0;max-width:40rem}
.steps li{position:relative;padding:0 0 2.4rem 3.4rem;border-inline-start:1px solid var(--line);margin-inline-start:.6rem}
.steps li:last-child{padding-bottom:0}
.steps .n{position:absolute;inset-inline-start:-.85rem;top:0;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--bg);border:1px solid var(--lime);color:var(--lime);display:grid;place-items:center;font-size:.72rem;font-weight:750}
.steps b{font-size:1.06rem;display:block}
.steps p{color:var(--mut);margin:.35rem 0 0;font-size:.96rem}
/* faq: minimalist text only */
.faq{max-width:44rem}
.faq details{border-bottom:1px solid var(--line);padding:1.15rem 0}
.faq details:first-of-type{border-top:1px solid var(--line)}
.faq summary{cursor:pointer;font-weight:600;font-size:1rem;list-style:none;display:flex;gap:1rem;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pm{margin-inline-start:auto;color:var(--lime);font-weight:400;font-size:1.2rem;flex:none}
.faq details p{color:var(--mut);margin:.7rem 0 0;font-size:.95rem;max-width:36rem}
/* final cta */
.final{text-align:center;padding:110px 0}
.final h2{font-size:clamp(2rem,4.5vw,3rem);max-width:34rem;margin:0 auto 1rem}
.final .sub{margin:0 auto 2.2rem;text-align:center}
/* footer */
footer{border-top:1px solid var(--line)}
.foot{max-width:1120px;margin:0 auto;padding:2.2rem 24px;display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--mut);font-size:.88rem}
.foot nav{display:flex;gap:1.2rem}
.foot a{color:var(--mut);text-decoration:none}
.foot a:hover{color:#fff}
/* reveal */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.visible{opacity:1;transform:none}
@media(max-width:960px){.hero{grid-template-columns:1fr;padding:70px 0 50px;gap:3.5rem}section.block{padding:70px 0}.fgrid{grid-template-columns:1fr 1fr}.links a.nl{display:none}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:640px){h1{font-size:2.5rem}.fgrid{grid-template-columns:1fr;gap:2rem}select.lang{max-width:128px}.phone{width:205px}.watch{width:155px}.final{padding:70px 0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="wrap" style="display:grid;place-items:center;min-height:100vh;text-align:center">
<div style="max-width:620px"><p style="font-size:3rem;margin:0">⚡</p>
<h1>404 — Page not found</h1>
<p class="sub" style="text-align:center;margin:1rem auto 2rem">This page moved to your wrist.</p>
<p><a class="btn btn-primary" href="https://asphalt123.github.io/otapo/">Back home</a></p>
<p style="font-size:.88rem;color:var(--mut)">
