plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.hn.otapo'
    compileSdk 34

    defaultConfig {
        applicationId "com.hn.otapo"
        minSdk 30
        targetSdk 34
        // version code "xxxx" (major, minor, patch, build). e.g. 0.2.1 1st build is (0)210
        versionCode 205
        versionName "0.2.0"
    }

    signingConfigs {
        release {
            // Configuré via variables d'env CI ; fallback debug si absent.
            // On vérifie l'existence du fichier (et pas seulement la présence
            // de la variable) car le workflow exporte toujours KEYSTORE_FILE,
            // même quand aucun keystore n'a été décodé.
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isEmpty() && new File(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // R8 désactivé en debug pour des builds rapides et des stacktraces lisibles.
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
        release {
            // NOTE: R8/minification volontairement désactivés : kotlinx-serialization
            // + Ktor s'appuient sur la réflexion et les règles ProGuard actuelles
            // sont minimales. Pour activer : minifyEnabled true + shrinkResources true
            // + compléter proguard-rules.pro (règles serialization déjà incluses),
            // puis valider : ./gradlew :app:assembleRelease.
            minifyEnabled false
            shrinkResources false
            debuggable false
            crunchPngs true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isEmpty() && new File(keystorePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear.watchface:watchface-complications-data:1.2.1'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    implementation 'io.ktor:ktor-client-core:2.3.12'
    implementation "io.ktor:ktor-client-android:2.3.12"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
}
