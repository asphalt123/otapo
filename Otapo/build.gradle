// Top-level build file where you can add configuration options common to all sub-projects.
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.24' apply false
}

// Versions centralisées — garder app et mobile cohérents.
// Voir app/build.gradle et mobile/build.gradle.
ext.versions = [
        coreKtx             : '1.12.0',
        recyclerview        : '1.3.2',
        wearable            : '18.1.0',
        wear                : '1.3.0',
        complications       : '1.2.1',
        ktor                : '2.3.12',
        coroutines          : '1.7.3',
        serializationJson   : '1.6.3',
        appcompat           : '1.6.1',
        material            : '1.8.0',
        constraintlayout    : '2.1.4',
        swiperefresh        : '1.1.0',
        playServicesLocation: '21.0.1'
]
